embedding:
  provider: nomic
  model: nomic-ai/nomic-embed-text-v2-moe
  trust_remote_code: true
  device: cpu
  batch_size: 16

chunking:
  default_strategy: structural
  fixed_size:
    chunk_size: 800
    overlap: 150
  structural:
    max_chunk_size: 1500
    split_by: heading

index:
  store: faiss_sqlite
  path: data/index

documents:
  path: data/documents
  extensions: [.md, .txt, .py, .js, .json]

llm:
  provider: deepseek
  model: deepseek-chat
  api_key_env: DEEPSEEK_API_KEY
  base_url: https://api.deepseek.com
  temperature: 0.2
  max_tokens: 1500
  timeout: 60

retrieval:
  top_k_retrieve: 10

reranking:
  enabled: true
  provider: threshold          # threshold | similarity | cross_encoder | none
  top_k_after_rerank: 20
  threshold:
    min_score: 0.1
    min_keep: 10
  similarity:
    weights:
      cosine: 0.6
      keyword_overlap: 0.3
      phrase_match: 0.1
  cross_encoder:
    model: BAAI/bge-reranker-v2-m3
    device: cpu

rewrite:
  enabled: false
  provider: none               # none | heuristic | llm
  heuristic:
    min_keywords: 3
  llm:
    temperature: 0.0
    max_tokens: 256

rag:
  default_index: ""
  unknown_threshold:
    min_chunks: 1          # после reranker
    min_score: 0.35        # лучший score после reranker
  output:
    require_sources: true
    require_citations: true
    verify_citations: true # проверять цитаты на наличие в чанках
    max_citations: 5
    max_sources: 5

evaluation:
  questions: data/eval/questions.yaml
  results_dir: data/eval/results

chat:
  default_index_name: null
  history_window: 6
  state_updater:
    provider: heuristic       # heuristic | llm
    update_after: pair        # user | pair
    llm:
      temperature: 0.0
      max_tokens: 500
  scenarios:
    path: data/chat/scenarios
    results_path: data/chat/scenarios/results

